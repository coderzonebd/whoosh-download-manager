# Weekly, grouped dependency updates. Minor/patch bumps arrive as one PR per
# ecosystem; major bumps come one by one so they can be reviewed on their own.
# The cooldown skips releases younger than a week (supply-chain hygiene; it
# also matches pnpm's minimumReleaseAge).
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      # The RustCrypto hashes share the `digest` traits (hmac needs sha2 of
      # the same generation), so their bumps only build together.
      rustcrypto:
        patterns: [digest, hmac, md-5, sha1, sha2]
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    # pnpm workspace: the root lockfile covers apps/* and packages/*.
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    ignore:
      # apps/desktop and packages/ui stay on TypeScript 6: svelte-check 4
      # runs on TypeScript 7 only behind an experimental --tsgo flag with
      # both versions installed. Lift this once svelte-check supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
