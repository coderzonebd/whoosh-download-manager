name: Set up Node.js and pnpm
description: >
  Node.js via setup-node, pnpm via corepack (version pinned by packageManager
  in package.json), optional pnpm store cache, then pnpm install --frozen-lockfile.
  Run actions/checkout first.

inputs:
  node-version:
    description: Node.js version
    default: "24"
  cache:
    description: Restore and save the pnpm store ("false" for release builds)
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        # pnpm is not on PATH yet; the store is cached below instead.
        package-manager-cache: false

    - name: Enable pnpm (corepack)
      id: pnpm
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: |
        corepack enable
        echo "pnpm $(pnpm --version)"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache the pnpm store
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: pnpm install
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: pnpm install --frozen-lockfile
