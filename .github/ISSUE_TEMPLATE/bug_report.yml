name: Bug report
description: Something does not work as it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Security problems go to a private advisory, not here** (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. A public URL that reproduces it helps a lot (no private links).
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Browser extension
        - Native messaging host (whoosh-nmhost)
        - Engine / daemon
        - Installer or package
        - labserver / benchmark harness
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, or a commit hash"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version, package type and browser (if relevant)
      placeholder: "Windows 11 24H2, NSIS installer, Chrome 142"
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Remove tokens, cookies and private URLs first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
