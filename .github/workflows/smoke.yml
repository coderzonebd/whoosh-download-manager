# The release smoke test (release.yml, job `smoke`) on its own, against the installers of an
# earlier Release run: for trying a change to .github/scripts/smoke-test.sh without building
# everything again. On a push that changes it, the finished Release run of that very commit is
# used; without one (a merge, say), nothing is tested.
name: Smoke test

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: ID of a finished Release run whose installers to test
        required: true
  push:
    paths:
      - .github/scripts/smoke-test.sh
      - .github/workflows/smoke.yml

permissions:
  contents: read
  actions: read # the other run's artifacts

jobs:
  find:
    name: Which installers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run-id: ${{ steps.r.outputs.run-id }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.run-id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id="$INPUT"
          if [ -z "$id" ]; then
            # A finished Release run of this commit that built the desktop installers: older
            # installers would test older code.
            for r in $(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --branch "$BRANCH" \
                         --commit "$GITHUB_SHA" --status completed -L 10 --json databaseId -q '.[].databaseId'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/artifacts" \
                   -q '.artifacts[].name' | grep -qx release-desktop-linux-x64; then
                id=$r; break
              fi
            done
          fi
          if [ -z "$id" ]; then
            echo "::notice::no Release run of $GITHUB_SHA with installers; nothing to test (start a Release dry run, then run this with its ID)"
            exit 0
          fi
          echo "Release run $id"
          echo "run-id=$id" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: find
    if: needs.find.outputs.run-id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-universal
            os: macos-15
          - platform: windows-x64
            os: windows-2025
          - platform: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-desktop-${{ matrix.platform }}
          path: smoke/desktop
          run-id: ${{ needs.find.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries-${{ matrix.platform }}
          path: smoke/binaries
          run-id: ${{ needs.find.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Install and try it
        shell: bash
        run: .github/scripts/smoke-test.sh smoke/desktop smoke/binaries smoke/out
      - name: Keep the screenshot and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke/out/
          if-no-files-found: ignore
          retention-days: 7
