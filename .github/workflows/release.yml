# Release: builds every artifact for a v* tag and attaches them to a DRAFT
# GitHub release. Nothing is ever published automatically; a maintainer
# reviews the draft and presses "Publish". See docs/release.md.
#
# workflow_dispatch = dry run: builds (and signs, when configured) everything
# and keeps the artifacts on the run, without creating a release.
#
# Signing steps switch on only when their secrets exist, so the pipeline
# works unsigned from the first push.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NODE_VERSION: "24"
  # Desktop release assets start with this (productName with hyphens; see
  # "Collect release assets" and .github/scripts/package-manifests.mjs).
  ASSET_PREFIX: Whoosh-Download-Manager

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Version check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      windows-bundles: ${{ steps.version.outputs.windows-bundles }}
      source-date-epoch: ${{ steps.version.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Releases are cut from pub
        # ADR 0006: a release tag must point at a commit on pub.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/pub...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) echo "$GITHUB_REF_NAME is on pub" ;;
            *) echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on pub (compare: $status). Tag the release merge commit on pub."; exit 1 ;;
          esac
      - name: Tag and manifest versions agree
        id: version
        run: |
          set -euo pipefail
          cargo_v=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tauri_v=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          desktop_v=$(jq -r .version apps/desktop/package.json)
          extension_v=$(jq -r .version apps/extension/package.json)
          mobile_v=$(jq -r .version apps/mobile/src-tauri/tauri.conf.json)
          mobile_pkg_v=$(jq -r .version apps/mobile/package.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=$tauri_v; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a release version (x.y.z or x.y.z-pre)"; exit 1
          fi
          bad=0
          for pair in "Cargo.toml=$cargo_v" "apps/desktop/src-tauri/tauri.conf.json=$tauri_v" \
                      "apps/desktop/package.json=$desktop_v" "apps/extension/package.json=$extension_v" \
                      "apps/mobile/src-tauri/tauri.conf.json=$mobile_v" "apps/mobile/package.json=$mobile_pkg_v"; do
            if [ "${pair#*=}" != "$version" ]; then
              echo "::error file=${pair%%=*}::version is ${pair#*=}, the tag says $version"; bad=1
            fi
          done
          [ "$bad" = 0 ]
          # WiX (MSI) rejects pre-release versions, so pre-releases ship NSIS only.
          case "$version" in
            *-*) prerelease=true;  windows_bundles=nsis ;;
            *)   prerelease=false; windows_bundles=nsis,msi ;;
          esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "windows-bundles=$windows_bundles"
            echo "source-date-epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
          echo "### Building $version (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: meta
    # Secrets (signing keys) only for a v* tag. A dry run (workflow_dispatch
    # on a branch) uses no environment, so it builds everything unsigned and
    # never needs the environment's tag-only deployment rule relaxed.
    # An empty environment name means "no environment".
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            # Oldest supported glibc for the AppImage / .deb / .rpm.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: linux-arm64
            # GitHub's free arm64 runner (public repositories), same glibc.
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: macos-universal
            os: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
          - platform: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
            bundles: "" # from meta: nsis,msi (nsis only for pre-releases)
          - platform: windows-arm64
            # GitHub's free Windows on Arm runner (public repositories).
            # NSIS only: Tauri's WiX (MSI) bundler does not target ARM64.
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
      TARGET: ${{ matrix.target }}
      WINDOWS_ARCH: ${{ matrix.arch }}
      BUNDLES: ${{ matrix.bundles || needs.meta.outputs.windows-bundles }}
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      # Opt-in crash reports (crates/crash): the DSN is compiled in by every
      # cargo/tauri build of this job, only for a v* tag (dry runs build
      # without it, so reporting is inert). Empty means "no DSN". Secrets are
      # masked in logs; never echo it.
      WDM_CRASH_DSN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WHOOSH_CRASH_DSN || '' }}
      UPDATER_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "false" # release builds start clean
      - name: Decide on updater artifacts
        # The Tauri CLI refuses createUpdaterArtifacts without plugins.updater
        # in tauri.conf.json, so both the key secret and the pinned public key
        # must exist. The public key is in the repository; the secret is the
        # owner's (docs/release.md, "Updater key").
        run: |
          has_pubkey=$(node -p "Boolean(require('./apps/desktop/src-tauri/tauri.conf.json').plugins?.updater?.pubkey)")
          if [ "$UPDATER_KEY_PRESENT" = true ] && [ "$has_pubkey" = true ]; then
            echo "UPDATER_ARTIFACTS=true" >> "$GITHUB_ENV"
          else
            if [ "$UPDATER_KEY_PRESENT" = true ]; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is set but tauri.conf.json has no plugins.updater.pubkey; no updater artifacts."
            fi
            echo "UPDATER_ARTIFACTS=false" >> "$GITHUB_ENV"
          fi
      - name: rustup (the Windows on Arm image lacks it)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSLo "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Rust toolchain (rust-toolchain.toml) and targets
        run: |
          rustup toolchain install
          if [ "$TARGET" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "$TARGET"
          fi
          rustc --version
          # Strip build-machine paths from the binaries (reproducibility).
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/wdm --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" >> "$GITHUB_ENV"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file

      # ---- macOS: Developer ID + notarization (Tauri CLI signs the .app) ----
      - name: Configure Developer ID signing and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: .github/scripts/apple-signing-env.sh

      # The daemon and the native host ship next to the app (ADR 0007).
      - name: Build the sidecars
        run: node apps/desktop/scripts/sidecars.mjs --target "$TARGET"

      # yt-dlp and ffmpeg ship inside every installer, so video and audio
      # sites work right after installation (packaging/media-tools). Fetched
      # by crates/media itself: the same upstreams and checksum checks as the
      # first-use download. The versions go into media-tools/manifest.json
      # and the job summary.
      - name: Fetch yt-dlp and ffmpeg for the installers
        env:
          # GitHub's API (QuickJS's release digests) limits anonymous requests per address, which
          # shared runners use up; wdm-media-bundle sends this token to api.github.com only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p wdm-media --bin wdm-media-bundle
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          echo "MEDIA_BUNDLER=$PWD/target/release/wdm-media-bundle$exe" >> "$GITHUB_ENV"
          dir=apps/desktop/src-tauri/media-tools
          rm -rf "$dir"
          "target/release/wdm-media-bundle$exe" fetch --target "$TARGET" --out "$dir" > media-tools.md
          cp packaging/media-tools/NOTICE.txt packaging/media-tools/LGPL-2.1.txt \
             packaging/media-tools/Unlicense.txt packaging/media-tools/QuickJS-MIT.txt \
             packaging/media-tools/Deno-MIT.txt "$dir/"
          cp LICENSE-GPL "$dir/GPL-3.0.txt"
          { echo "#### yt-dlp and ffmpeg in the $TARGET installers"; echo; cat media-tools.md; } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$dir"
      - name: Sign yt-dlp, ffmpeg, QuickJS and Deno (macOS)
        # Inside the .app they must be signed like the app: Developer ID when
        # configured, else ad hoc. lipo's universal ffmpeg is unsigned. Signing
        # changes the files, so the manifest's checksums are taken again.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dir=apps/desktop/src-tauri/media-tools
          files=()
          for f in yt-dlp ffmpeg ffprobe qjs deno; do [ -e "$dir/$f" ] && files+=("$dir/$f"); done
          if [ "$APPLE_SIGNING_ENABLED" = true ]; then
            # yt-dlp is a PyInstaller program: under the hardened runtime it
            # loads the Python libraries it unpacks, signed by its authors.
            MACOS_SIGN_ENTITLEMENTS=packaging/media-tools/yt-dlp.entitlements \
              .github/scripts/macos-sign.sh "$dir/yt-dlp"
            # Deno runs V8: under the hardened runtime it needs JIT memory.
            MACOS_SIGN_ENTITLEMENTS=packaging/media-tools/deno.entitlements \
              .github/scripts/macos-sign.sh "$dir/deno"
            others=()
            for f in "${files[@]:1}"; do [ "$f" = "$dir/deno" ] || others+=("$f"); done
            .github/scripts/macos-sign.sh "${others[@]}"
          else
            for f in "${files[@]}"; do
              codesign --force --sign - "$f"
              codesign --verify --strict "$f"
            done
          fi
          "$MEDIA_BUNDLER" rehash "$dir" > /dev/null

      # ---- Linux and macOS: one tauri build ----
      - name: Build and bundle
        if: runner.os != 'Windows'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Sidecars (daemon, native host) and the browser integration
          # (packaging/browsers/README.md).
          args=(--ci --target "$TARGET" --bundles "$BUNDLES" --config src-tauri/tauri.sidecars.conf.json
                --config src-tauri/tauri.browsers.conf.json --config src-tauri/tauri.media.conf.json)
          if [ "$UPDATER_ARTIFACTS" = true ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm tauri build "${args[@]}"
      - name: Check yt-dlp and ffmpeg inside the bundles
        # The bundler must ship them byte for byte (the daemon refuses a
        # file that does not match the manifest and downloads instead).
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          check() {
            local found=("$@")
            if [ "${#found[@]}" != 1 ] || [ ! -d "${found[0]}" ]; then
              echo "::error::media-tools not found: ${found[*]}"; exit 1
            fi
            "$MEDIA_BUNDLER" verify "${found[0]}" > /dev/null
            echo "ok: ${found[0]}"
          }
          tmp=$(mktemp -d)
          case "$RUNNER_OS" in
            macOS)
              for app in "$bundle"/macos/*.app; do
                check "$app/Contents/Resources/media-tools"
                codesign --verify --strict "$app/Contents/Resources/media-tools/ffmpeg"
              done ;;
            Linux)
              for deb in "$bundle"/deb/*.deb; do
                dpkg-deb -x "$deb" "$tmp/deb"
                check "$tmp"/deb/usr/lib/*/media-tools
              done
              for img in "$bundle"/appimage/*.AppImage; do
                img=$(realpath "$img")
                (cd "$tmp" && "$img" --appimage-extract > /dev/null)
                check "$tmp"/squashfs-root/usr/lib/*/media-tools
              done ;;
          esac
          rm -rf "$tmp"
      - name: Sign and notarize the .dmg
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        run: |
          for dmg in target/"$TARGET"/release/bundle/dmg/*.dmg; do
            .github/scripts/macos-sign.sh "$dmg"
            .github/scripts/macos-notarize.sh "$dmg"
          done

      # ---- Windows: build, sign the exe, bundle, sign the installers ----
      - name: Build the executable
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: |
          pnpm tauri build --ci --target "$TARGET" --no-bundle \
            --config src-tauri/tauri.sidecars.conf.json --config src-tauri/tauri.browsers.windows.conf.json \
            --config src-tauri/tauri.media.conf.json
      - name: Stage the executable for signing
        if: runner.os == 'Windows'
        run: |
          mkdir -p staging/exe
          cp "target/$TARGET/release/wdm-desktop.exe" staging/exe/
          # The sidecars go into the installers too; SignPath signs every .exe.
          for b in wdm-daemon wdm-nmhost; do
            cp "apps/desktop/src-tauri/binaries/$b-$TARGET.exe" staging/exe/
          done
      - name: Upload the unsigned executable
        id: unsigned-exe
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-desktop-exe
          path: staging/exe/
          if-no-files-found: error
          retention-days: 1
      - name: Sign the executable (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/exe
      - name: Use the signed executable
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        run: |
          cp signed/exe/wdm-desktop.exe "target/$TARGET/release/wdm-desktop.exe"
          for b in wdm-daemon wdm-nmhost; do
            cp "signed/exe/$b-$TARGET.exe" "apps/desktop/src-tauri/binaries/$b-$TARGET.exe"
          done
      - name: Bundle the installers
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        # --no-binary-patching: patching would rewrite (and unsign) the exe.
        run: |
          pnpm tauri bundle --ci --target "$TARGET" --bundles "$BUNDLES" --no-binary-patching \
            --config src-tauri/tauri.sidecars.conf.json --config src-tauri/tauri.browsers.windows.conf.json \
            --config src-tauri/tauri.media.conf.json
      - name: Stage the installers for signing
        if: runner.os == 'Windows'
        run: |
          mkdir -p staging/installers
          cp target/"$TARGET"/release/bundle/nsis/*-setup.exe staging/installers/
          if [ -d target/"$TARGET"/release/bundle/msi ]; then
            cp target/"$TARGET"/release/bundle/msi/*.msi staging/installers/
          fi
      - name: Upload the unsigned installers
        id: unsigned-installers
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-desktop-installers
          path: staging/installers/
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installers (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installers
      - name: Use the signed installers
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        run: cp signed/installers/* staging/installers/
      - name: Updater signatures for the installers
        if: runner.os == 'Windows' && env.UPDATER_ARTIFACTS == 'true'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in ../../staging/installers/*.exe ../../staging/installers/*.msi; do
            [ -e "$f" ] || continue
            pnpm tauri signer sign --app-version "$VERSION" "$f"
          done

      # ---- All platforms: collect ----
      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p out
          bundle="target/$TARGET/release/bundle"
          case "$RUNNER_OS" in
            Linux)
              cp "$bundle"/appimage/*.AppImage* "$bundle"/deb/*.deb* "$bundle"/rpm/*.rpm* out/ ;;
            macOS)
              cp "$bundle"/dmg/*.dmg out/
              # The updater archive is named after the app only; add version and arch.
              for f in "$bundle"/macos/*.app.tar.gz*; do
                [ -e "$f" ] || continue
                name=$(basename "$f"); cp "$f" "out/${name/.app.tar.gz/_${VERSION}_universal.app.tar.gz}"
              done ;;
            Windows)
              cp staging/installers/* out/
              # Portable build: the (signed) app with its daemon and native
              # host next to it, and yt-dlp and ffmpeg where the installers
              # put them (the app's resource directory is its own folder on
              # Windows); needs the WebView2 runtime.
              mkdir -p portable
              cp "target/$TARGET/release/wdm-desktop.exe" portable/
              for b in wdm-daemon wdm-nmhost; do
                cp "apps/desktop/src-tauri/binaries/$b-$TARGET.exe" "portable/$b.exe"
              done
              cp -R apps/desktop/src-tauri/media-tools portable/media-tools
              "$MEDIA_BUNDLER" verify portable/media-tools > /dev/null
              (cd portable && 7z a -tzip -mx=9 "../out/${ASSET_PREFIX}_${VERSION}_${WINDOWS_ARCH}_portable.zip" . >/dev/null) ;;
          esac
          # Tauri names the bundles after productName, "Whoosh Download
          # Manager"; GitHub would turn the spaces in an asset name into dots.
          # Hyphens instead: Whoosh-Download-Manager_<v>_amd64.deb,
          # Whoosh-Download-Manager-<v>-1.x86_64.rpm, and the .sig files with
          # them (the updater signs the bytes, not the name).
          for f in out/*\ *; do
            [ -e "$f" ] || continue
            name=$(basename "$f"); mv "$f" "out/${name// /-}"
          done
          for f in out/*; do
            case "$(basename "$f")" in "$ASSET_PREFIX"[_-]*) ;; *) echo "::error::unexpected asset name: $f"; exit 1 ;; esac
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android (APK and AAB)
    needs: meta
    # The upload keystore only for a v* tag (as the desktop signing keys); a dry run signs with a
    # throwaway debug key, good for testing on a phone and nothing else.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      KEYSTORE_PRESENT: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "false" # release builds start clean
      - name: Android SDK and NDK
        # The runner image has the SDK and an NDK; the app compiles against Android 37.
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          {
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            echo "JAVA_HOME=$JAVA_HOME_21_X64"
          } >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Upload keystore
        if: env.KEYSTORE_PRESENT == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "WDM_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/mobile
        env:
          WDM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WDM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WDM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64 only: the app carries yt-dlp's Python and ffmpeg (~50 MB per processor type),
        # and the build keeps only arm64-v8a (app/build.gradle.kts).
        run: pnpm tauri android build --ci --apk --aab --target aarch64
      - name: Collect
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = true ] && [ "$KEYSTORE_PRESENT" != true ]; then
            # A debug-signed APK in a release would lock its users out of every real update.
            echo "::warning::no ANDROID_KEYSTORE_BASE64: this release ships no Android app (docs/release.md, Android)"
            exit 0
          fi
          out="apps/mobile/src-tauri/gen/android/app/build/outputs"
          mkdir -p dist
          cp "$out/apk/universal/release/app-universal-release.apk" "dist/Whoosh-Download-Manager_${VERSION}_android.apk"
          cp "$out/bundle/universalRelease/app-universal-release.aab" "dist/Whoosh-Download-Manager_${VERSION}_android.aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/Whoosh-Download-Manager_${VERSION}_android.apk" | head -n 3
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  binaries:
    name: CLI and native host (${{ matrix.platform }})
    needs: meta
    # Secrets (signing keys) only for a v* tag. A dry run (workflow_dispatch
    # on a branch) uses no environment, so it builds everything unsigned and
    # never needs the environment's tag-only deployment rule relaxed.
    # An empty environment name means "no environment".
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          - platform: macos-universal
            os: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: windows-x64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
          - platform: windows-arm64
            os: windows-11-arm
            targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
      TARGETS: ${{ matrix.targets }}
      PLATFORM: ${{ matrix.platform }}
      # The command line (wdm + wdm-daemon, and on Windows the
      # console-less autostart helper) and the native messaging host.
      # wdm-labserver is a test server and is not released.
      BINARIES: wdm wdm-daemon wdm-autostart wdm-nmhost
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      # Opt-in crash reports (crates/crash): the DSN is compiled in by every
      # cargo/tauri build of this job, only for a v* tag (dry runs build
      # without it, so reporting is inert). Empty means "no DSN". Secrets are
      # masked in logs; never echo it.
      WDM_CRASH_DSN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WHOOSH_CRASH_DSN || '' }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rustup (the Windows on Arm image lacks it)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSLo "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Rust toolchain (rust-toolchain.toml) and targets
        run: |
          rustup toolchain install
          # shellcheck disable=SC2086 # TARGETS is a list
          rustup target add $TARGETS
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/wdm --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" >> "$GITHUB_ENV"
      - name: Build
        run: |
          for t in $TARGETS; do
            cargo build --release --locked --target "$t" -p wdm-cli -p wdm-daemon -p wdm-nmhost
          done
      - name: Stage the binaries
        run: |
          set -euo pipefail
          mkdir -p staging/bin
          for b in $BINARIES; do
            # The autostart helper exists for Windows only (no console window).
            if [ "$b" = wdm-autostart ] && [ "$RUNNER_OS" != Windows ]; then continue; fi
            case "$PLATFORM" in
              macos-universal)
                lipo -create -output "staging/bin/$b" \
                  "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b" ;;
              windows-*) cp "target/$TARGETS/release/$b.exe" staging/bin/ ;;
              *) cp "target/$TARGETS/release/$b" staging/bin/ ;;
            esac
          done
          ls -l staging/bin

      - name: Configure Developer ID signing and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: .github/scripts/apple-signing-env.sh
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        run: |
          .github/scripts/macos-sign.sh staging/bin/*
          ditto -c -k staging/bin "$RUNNER_TEMP/notarize.zip"
          .github/scripts/macos-notarize.sh "$RUNNER_TEMP/notarize.zip"

      - name: Upload the unsigned binaries
        id: unsigned-bin
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-binaries
          path: staging/bin/
          if-no-files-found: error
          retention-days: 1
      - name: Sign (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-bin.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/bin
      - name: Use the signed binaries
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        run: cp signed/bin/* staging/bin/

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          # GNU tar for --sort/--owner/--mtime (macOS runners ship it as gtar).
          tar=tar; if command -v gtar > /dev/null; then tar=gtar; fi
          # Two archives: wdm-<v>-<platform> (the CLI and the daemon) and
          # wdm-nmhost-<v>-<platform>.
          for name in wdm wdm-nmhost; do
            dir="$name-$VERSION-$PLATFORM"
            mkdir -p "pkg/$dir"
            case "$name" in
              wdm)
                for f in staging/bin/*; do
                  case "$(basename "$f")" in wdm-nmhost*) ;; *) cp "$f" "pkg/$dir/" ;; esac
                done
                cp crates/cli/README.md "pkg/$dir/README.md" ;;
              wdm-nmhost)
                cp staging/bin/wdm-nmhost* "pkg/$dir/"
                cp crates/nmhost/README.md "pkg/$dir/README.md" ;;
            esac
            cp LICENSE-APACHE "pkg/$dir/"
            if [ "$RUNNER_OS" = Windows ]; then
              (cd pkg && 7z a -tzip -mx=9 "../out/$dir.zip" "$dir" >/dev/null)
            else
              # Deterministic tarball: sorted entries, fixed owner and mtime.
              "$tar" --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
                -C pkg -cf - "$dir" | gzip -n -9 > "out/$dir.tar.gz"
            fi
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  extension:
    name: Extension (store builds)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "false"
      - name: Build the store zips (no development key)
        working-directory: apps/extension
        run: node scripts/build.mjs --store --zip
      - name: Build the GitHub Chromium zip (keeps the key)
        # For Chrome, Brave and Vivaldi until the Chrome Web Store listing:
        # loaded unpacked, the public key gives it the ID the native host
        # allows (packaging/browsers/extension-ids.json, github.chromiumId).
        working-directory: apps/extension
        run: |
          node scripts/build.mjs --target chromium --zip --out dist-github
          jq -e 'has("key")' dist-github/chromium/manifest.json > /dev/null
      - name: Store manifests carry no key
        run: |
          for t in chromium firefox; do
            jq -e 'has("key") | not' "apps/extension/dist/$t/manifest.json" > /dev/null \
              || { echo "::error::dist/$t/manifest.json still has a key"; exit 1; }
          done
          mkdir -p out
          cp apps/extension/dist/*-store.zip apps/extension/dist-github/wdm-chromium-*.zip out/
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: out/
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM (CycloneDX)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "false"
      - name: Rust SBOMs (one per workspace crate, all targets)
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --target all
          mkdir -p out
          for f in $(git ls-files -o --exclude-standard -- '*.cdx.json'); do
            crate=$(basename "$f" .cdx.json)
            mv "$f" "out/$crate-$VERSION.cargo.cdx.json"
          done
      - name: npm SBOMs (shipped apps, production dependencies)
        run: |
          pnpm --filter @wdm/desktop --filter @wdm/extension sbom \
            --sbom-format cyclonedx --sbom-spec-version 1.6 --sbom-type application --prod \
            --split --out "out/%s-%v.npm.cdx.json"
          ls -l out
          test "$(find out -name '*.cdx.json' | wc -l)" -ge 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: out/
          if-no-files-found: error
          retention-days: 7

  manifests:
    name: Package manifests and source archive
    needs: [meta, desktop, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-desktop-*
          merge-multiple: true
          path: assets
      - name: Source archive
        run: |
          mkdir -p out
          git archive --format=tar --prefix="wdm-$VERSION/" "$GITHUB_SHA" \
            | gzip -n -9 > "out/wdm-$VERSION-source.tar.gz"
          cp "out/wdm-$VERSION-source.tar.gz" assets/
      - name: Fill in the winget, Scoop, Homebrew, Flathub and AUR manifests
        # Real version, URLs and SHA-256s; attached to the release, submitted
        # by hand (packaging/<channel>/README.md). Nothing is submitted here.
        run: |
          set -euo pipefail
          dir="wdm-$VERSION-package-manifests"
          node .github/scripts/package-manifests.mjs assets "$VERSION" "$RUNNER_TEMP/$dir"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
            -C "$RUNNER_TEMP" -cf - "$dir" | gzip -n -9 > "out/$dir.tar.gz"
          tar -tzf "out/$dir.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifests
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub release
    needs: [meta, desktop, binaries, extension, sbom, manifests, android]
    # Never on a dry run: only a v* tag creates (or refreshes) a draft release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # Sigstore certificate for the provenance attestation
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Updater manifest (latest.json)
        run: |
          node .github/scripts/updater-manifest.mjs dist "$VERSION" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      - name: SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort \
            | xargs -d '\n' sha256sum -- > ../SHA256SUMS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > is_draft 2>/dev/null; then
            if [ "$(cat is_draft)" != true ]; then
              echo "::error::Release $TAG is already published; refusing to change it."; exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            notes="$RUNNER_TEMP/notes.md"
            {
              echo "## Verify your download"
              echo
              echo '```bash'
              echo "sha256sum --check --ignore-missing SHA256SUMS"
              echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
              echo '```'
              echo
              echo "Details: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/release.md#verifying-a-download"
              echo
            } > "$notes"
            flags=(--draft --verify-tag --title "Whoosh Download Manager $VERSION" --generate-notes --notes-file "$notes")
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
          {
            echo "### Draft release $TAG"
            echo "Review the assets, then publish it by hand:"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          } >> "$GITHUB_STEP_SUMMARY"
