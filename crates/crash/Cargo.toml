[package]
name = "whoosh-crash"
description = "Opt-in crash reports (Sentry protocol, hosted GlitchTip) with a scrubber that removes links, file names, paths and user names"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
regex = "1"
serde.workspace = true
serde_json.workspace = true
# No performance tracing, no sessions, no debug images: panics and errors
# only. rustls (ring) like the rest of the workspace, no OpenSSL.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls"] }

[dev-dependencies]
sentry = { version = "0.49", default-features = false, features = ["test"] }

[lints]
workspace = true
