[package]
name = "wdm-cli"
description = "wdm: the command-line client of the wdm download daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "wdm"
path = "src/main.rs"

# Starts the daemon at logon without a console window (see
# wdm_client::autostart); ships next to `wdm`.
[[bin]]
name = "wdm-autostart"
path = "src/bin/wdm-autostart.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
wdm-client.workspace = true
wdm-proto.workspace = true

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
