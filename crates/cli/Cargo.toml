[package]
name = "whoosh-cli"
description = "whoosh: the command-line client of the whoosh download daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "whoosh"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
whoosh-client.workspace = true
whoosh-proto.workspace = true

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
