[package]
name = "wdm-engine"
description = "The download engine: work-stealing scheduler, hedged requests, learned connection counts, retries, queues; implements wdm_proto::service::Service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
fastrand = "2"
futures.workspace = true
hex = "0.4"
# Local time and the system time zone (IANA rules, DST; on Windows it maps
# the Windows zone and bundles the database). Already in the lock file.
jiff = "1.0"
md-5 = "0.11"
percent-encoding = "2"
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
wdm-core.workspace = true
wdm-proto.workspace = true

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
wdm-core = { workspace = true, features = ["testing"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.32", features = ["resource"] }

[lints]
workspace = true
