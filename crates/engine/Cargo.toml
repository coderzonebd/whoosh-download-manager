[package]
name = "whoosh-engine"
description = "The download engine: work-stealing scheduler, hedged requests, learned connection counts, retries, queues; implements whoosh_proto::service::Service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
fastrand = "2"
futures.workspace = true
hex = "0.4"
md-5 = "0.10"
percent-encoding = "2"
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
whoosh-core.workspace = true
whoosh-proto.workspace = true

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
whoosh-core = { workspace = true, features = ["testing"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["resource"] }

[lints]
workspace = true
