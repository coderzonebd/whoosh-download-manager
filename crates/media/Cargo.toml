[package]
name = "whoosh-media"
description = "Video and audio sites: yt-dlp and ffmpeg as separate programs, fetched on first use; media downloads through the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
whoosh-core.workspace = true
whoosh-net.workspace = true
whoosh-proto.workspace = true

getrandom = "0.4"
hex = "0.4"
sha2 = "0.11"
url = "2"

[dev-dependencies]
tempfile = "3"
whoosh-engine.workspace = true
whoosh-store.workspace = true
whoosh-labserver = { path = "../labserver" }

# The fake yt-dlp and ffmpeg are this test binary run again with
# WHOOSH_FAKE_TOOL set, so the test needs its own main (no libtest).
[[test]]
name = "media"
harness = false

[lints]
workspace = true
