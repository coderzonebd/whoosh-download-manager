[package]
name = "whoosh-daemon"
description = "The whoosh daemon: serves the local JSON-RPC API (PROTOCOL.md) over WebSocket for any Service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "whoosh_daemon"
path = "src/lib.rs"

[[bin]]
name = "whoosh-daemon"
path = "src/main.rs"

[features]
default = ["media"]
media = ["dep:whoosh-media"]

[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["env"] }
whoosh-proto.workspace = true
# The real service, wired only in the binary (src/main.rs; ADR 0005).
whoosh-engine.workspace = true
whoosh-net.workspace = true
whoosh-store.workspace = true
# Video and audio sites through yt-dlp/ffmpeg (`media` feature, on by
# default for desktop and GitHub builds; a store build turns it off).
whoosh-media = { workspace = true, optional = true }

bytes = "1"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
subtle = "2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing-appender = "0.2"

[target."cfg(unix)".dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints]
workspace = true
