[package]
name = "whoosh-desktop"
description = "Whoosh desktop app: the shared Svelte UI over the whoosh daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "whoosh_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "whoosh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# `deep-link`: a second launch with a whoosh:// URL hands it to the first.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Signed in-app updates from GitHub Releases (`updates.rs`).
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
whoosh-client.workspace = true
# Host registration and browser detection for "Connect your browser".
whoosh-nmhost = { path = "../../../crates/nmhost" }
# Crash reports (on by default, can be turned off; inert without WHOOSH_CRASH_DSN).
whoosh-crash.workspace = true
whoosh-proto.workspace = true

[lints]
workspace = true
