[package]
name = "wdm-desktop"
description = "WDM desktop app: the shared Svelte UI over the wdm daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "wdm_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "wdm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# The add dialog fills in a download link from the clipboard.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# `deep-link`: a second launch with a whoosh:// URL hands it to the first.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Signed in-app updates from GitHub Releases (`updates.rs`).
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
# The shell's watch on the daemon (`watch.rs`) waits between reconnects.
tokio = { workspace = true, features = ["time"] }
wdm-client.workspace = true
# Host registration and browser detection for "Connect your browser".
wdm-nmhost = { path = "../../../crates/nmhost" }
# Crash reports (on by default, can be turned off; inert without WDM_CRASH_DSN).
wdm-crash.workspace = true
wdm-proto.workspace = true

[lints]
workspace = true
